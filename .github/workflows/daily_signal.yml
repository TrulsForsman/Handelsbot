name: Run Daily Trading Signal

on:
  schedule:
    # Körs måndag-fredag kl 15:15 UTC (motsvarar kl 17:15 i Sverige under sommartid)
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Gör det möjligt att starta skriptet manuellt när som helst

jobs:
  run-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Ladda ner koden
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör skriptet
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

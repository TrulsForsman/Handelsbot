name: Run Daily Trading Signal

on:
  schedule:
    # Körs måndag-fredag kl 15:15 UTC (kl 17:15 svensk tid under sommartid)
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Tillåter manuell start från mobilen/GitHub-appen

# Ge skriptet rättighet att spara ändringar i repot
permissions:
  contents: write

jobs:
  run-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Ladda ner koden
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör skriptet
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Spara uppdaterade innehav till GitHub Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add holdings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uppdatera portföljinnehav [skip ci]" && git push)
